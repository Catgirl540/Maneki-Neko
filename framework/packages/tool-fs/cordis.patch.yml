# DSH 0.2 的 sdk-minimal 已挂载 filesystem、tool-fs 和 attachment-local。
# 替换文件系统提供者，保留原有读写工具面及 hardening 白名单，不重复注册服务。
- id: filesystem
  disabled: true
- id: tool-fs
  config:
    read: true
    readImage: true
    write: true
    edit: true
- insert:
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'
    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'
