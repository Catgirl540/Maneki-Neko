# 自检 overlay：只在 `--patch` 时挂载，不进生产树。
# 用 scripts/dsh-profile.sh --patch <此文件> 来跑框架自检。
- insert:
    - id: luckycat-probe
      name: '@LUCKYCAT_PROBE_PLUGIN@'

# 探针工具也要进白名单——顺带演示"新增能力必须显式改配置"这件事：
# 不改这一行，luckycat_probe_secret 会被加固守卫直接拒绝。
# 注意：按 id 覆盖会替换**整个** config，所以字段要写全。
- id: luckycat-hardening
  config:
    allowedTools:
      # 自检 overlay 是**整段替换**白名单的，所以这里也得写上提问工具——
      # 少了它，自检里的模型一问问题就会被守卫拒掉（而生产树是有的）。
      - ask_user_question
      - skill
      - knowledge_lookup
      - luckycat_ping
      - luckycat_probe_secret
      - bank_request_human_support
      - bank_list_support_tickets
      - bank_get_support_ticket
      - bank_reply_support_ticket
      - bank_get_balance
      - bank_list_transactions
      - bank_review_transactions
      - bank_get_transaction_detail
      - bank_transfer
      - bank_wealth_quote
      - bank_wealth_compare
      - bank_list_investments
      - bank_list_im_reminders
      - bank_create_im_reminder
      - bank_cancel_im_reminder
      - bank_create_invest_plan
      - bank_update_invest_plan
      - bank_wealth_subscribe
      - bank_wealth_redeem
      - bank_reveal_card_secret
      - bank_fps_transfer
      - bank_list_banks
      - bank_list_payees
      - bank_resolve_fps
      - bank_verify_recipient
      - bank_recall_transfer
      - bank_list_cards
      - bank_card_products
      - bank_set_card_lock
      - bank_update_card_settings
      - bank_spend
      - bank_list_budgets
      - bank_apply_card
      - bank_replace_card
      - bank_list_autodebits
      - bank_analyze_autodebits
      - bank_set_autodebit
      - bank_get_spending
      - bank_get_cashflow
      - bank_list_scheduled_transfers
      - bank_schedule_transfer
      - bank_cancel_scheduled_transfer
      - bank_update_payee_remark
      - bank_list_split_collections
      - bank_create_split_collection
      - bank_cancel_split_collection
      - bank_confirm_split_payment
      - bank_prepare_split_reminder
      - bank_get_billing_report
      - bank_wealth_recommend
      - bank_report_card_lost
      - bank_recover_card
      - bank_find_subscription_candidates
      - bank_create_renewal_reminder
      - bank_list_birthday_plans
      - bank_create_birthday_plan
      - bank_cancel_birthday_plan
      - bank_confirm_birthday_order
    secretEnv:
      - OPENROUTER_API_KEY
      - RELAYROUTER_API_KEY
      - DEEPSEEK_API_KEY
      - LUCKYCAT_PROBE_FAKE_SECRET
    redactTelemetry: true
