# luckycat 框架的 profile 补丁层（模板）。
# 由 scripts/bootstrap.sh 复制到 $DSH_HOME/profiles/luckycat/ 并替换 @…@ 占位符。
#
# 设计口径：**不改内核**——只按行 id 覆盖配置、disabled 关闭行、insert 增行。

# ── 1. 安全钉值 ────────────────────────────────────────────────────────────
# sdk-minimal 出厂是 danger-full-access；本框架钉成 read-only。
# 注意：**不使用** DSH_PERMISSION_MODE 这个单点开关——它会把沙箱开到全权
# 并把审批同时设成 never。
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

# sdk-minimal 不含审批，补上（审批 ask；无 answerer 时 fail-closed → deny）。
- insert:
    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: ask

# 刻意**不**挂 @deepseek-ai/dsh-permission-presets：
#   1) 它 inject 'shell'，而本框架删掉了全部 shell 行 → 会一直 pending；
#   2) 它自带 danger-full-access preset（sandbox 全权 + approval never），
#      等于把一个安全翻转开关留进树里。我们直接钉 sandbox-policy + approval，
#      不需要这一层间接。

# ── 2. 删行：框架无 shell ───────────────────────────────────────────────────
# 匹配不到的补丁只 warn 不报错，所以 verify 必须把这些行 id 的"确已消失"当成断言。
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: pty
  disabled: true
- id: mcp-resources
  disabled: true
- id: jobs
  disabled: true

# ── 2b. 删行：官方 API 的数据回传（银行框架必须删） ─────────────────────────
# session-log-deepseek：把「规范化会话日志」**增量上传**给官方 DeepSeek API
#   （README 原文："Disable it only when the official API must not receive a
#    Session-log suffix."）。对银行而言这是客户对话外泄通道，一律删。
# plugin-package-inventory-deepseek：把当前插件包清单上传给官方 API。
# 上面两个都**硬注入** deepseekLlmApiExtensions，所以注册表也一起删——
# 否则它们会 pending（loader 会报 "waiting for service"）。
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true

# ── 3. luckycat 插件 ──────────────────────────────────────────────────────
# 插件不再由本文件按绝对路径插入，而是各自作为 **bundle** 安装：
#   dsh plugin --profile luckycat add <包路径>
# 装了带 dsh.bundle.patch 的包 → 自动选中该 bundle；卸载 → 取消选中。
# 本文件只负责按 id **配置**那些行（例如下面的模型路由、语料、白名单）。

# ── 4. 换模型适配器：多供应商（P1） ─────────────────────────────────────────
# sdk-minimal 出厂只装了 DeepSeek 官方适配器。DSH 的多供应商能力在
# @deepseek-ai/dsh-llm-pi-ai（基于 pi-ai）：配置路由即可接第三方，零代码。
# 换模型 = 改这里的配置，或由调用方在 SDK 握手里指定 provider/model。
- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          # 云端：OpenRouter。模型 id 见 config/models.md，均为免费档。
          openrouter:
            displayName: OpenRouter
            apiKeyEnv: OPENROUTER_API_KEY
            api: openai-completions
            baseURL: https://openrouter.ai/api/v1
            # 必须显式写 normal：always 模式会无限重试且每次都计费。
            retryPolicy:
              mode: normal
            models:
              - id: nvidia/nemotron-3-ultra-550b-a55b:free
                name: Nemotron 3 Ultra 550B (free)
                contextWindow: 1000000
              - id: nvidia/nemotron-3.5-lightning:free
                name: Nemotron 3.5 Lightning (free)
                contextWindow: 1000000
              # ══ 默认：Qwen 3.8 Flash ══════════════════════════════════════
              # 2026-09-20 实测：**e2e-consent.sh 全过（23 项 ok、0 失败）**，
              # 工具调用与参数都正确（`bank_transfer`：梁乐怡 / 尾号 9123 /
              # 80000 分 / 备注房租），并且正常发起审批。
              # 唯一 provider 是 Alibaba（`/endpoints` 查过），和 DeepInfra 那摊
              # 过载无关，所以不会重演下面 ling 系的 429。
              # 代价：$0.15/M 输入、$0.47/M 输出（比 ling 免费档贵）。
              - id: qwen/qwen3.8-flash
                name: Qwen 3.8 Flash
                contextWindow: 1000000
              # ── 备选：ling 系（都**不是**默认，选它们的理由与坑见下面记录）────
              #
              #   模型                       工具调用   可用性
              #   ─────────────────────────────────────────────────────────
              #   ling-3.0-flash-vl:free     ✅ 会      共享池，并发 429
              #   ling-3.0-flash-vl (付费)   （测不了） 3/3 engine_overloaded
              #   ling-3.0-flash    (付费)   ❌ 不会    可用、快
              #   ling-3.0-flash-fin(付费)   ❌ 不会    可用、快
              #
              # 「不会」的具体样子：系统提示里明明写了「不要用文字向用户征求确认、
              # 也不要问『要不要我帮您执行』——直接调用工具即可」，这两个付费档
              # **无视它**，反过来问用户「请确认以上信息是否正确，我将为您执行转账」，
              # 然后 `finish: stop`，一个工具都不调。后果是整条敏感操作链路断掉：
              # 没有工具调用 → 没有确认卡片 → e2e-consent.sh 用例 1 直接失败。
              # **注意别被裸测骗了**：用两三个工具的极简 prompt 裸测时，这两个档
              # 是会调工具的；只有放进真实应用（10 个工具 + 完整人设）才暴露。
              #
              # 所以换模型时**不要只打一发 chat 接口**，要跑 e2e-consent.sh。
              - id: inclusionai/ling-3.0-flash-vl:free
                name: Ling 3.0 Flash VL (free · shared pool)
                contextWindow: 262144
              # 注意：**不在这个列表里的模型会被运行时直接拒绝**
              # （报 `pi-ai provider "openrouter" has no configured model "…"`），
              # 所以「临时试试某个模型」也必须先在这里登记。
              # ── 以下是备选，都**不是**默认 ────────────────────────────
              #
              # `ling-3.0-flash-fin`（付费，金融微调）——**测过了，不能用**：
              #   单发很快（1.2-1.4s）、也会调工具（用两三个工具的裸测下），
              #   但在**真实应用**里（10 个工具 + 完整人设）它把整段思维链写进
              #   **给用户看的正文**（不是 reasoning 字段），然后 `finish: stop`，
              #   **一次工具都不调**。后果是敏感操作链路整条失效：
              #   `framework/scripts/e2e-consent.sh` 用例 1 直接失败
              #   （「120 秒内没收到待确认事项」→ 转账永远不会走到确认卡片）。
              #   保留在目录里只是留个记录，别拿来当默认。
              - id: inclusionai/ling-3.0-flash-fin
                name: Ling 3.0 Flash Fin (paid · 实测不调工具，勿用)
                contextWindow: 262144
              # 关于「付费就不限流」这件事，实测答案是**否**。记在这里免得再踩：
              #
              #   · `ling-3.0-flash-vl:free`（上游 Novita）：并发几个请求就 429，
              #     `limit_source: upstream_provider_shared_pool`。
              #   · `ling-3.0-flash-vl`（付费档 $0.06/M，DeepInfra）**同样 429**：
              #     `provider_error_code: engine_overloaded`、
              #     `limit_source: upstream_provider_shared_pool`、`is_byok: false`。
              #     `is_byok: false` 是关键——OpenRouter 用的是**它自己的** DeepInfra
              #     账号，所以付费并没有换到「我们自己的额度」。实测连续 7 次全 429。
              #     真要脱离共享池得 **BYOK**（到 openrouter.ai/settings/integrations
              #     配自己的 provider key），或给模型配多家 provider 做回落。
              #
              # 每个 ling 模型都只有 DeepInfra 一家 provider（`/endpoints` 查过），
              # 所以「换一家 provider」在当前配置下走不通，只能换模型或 BYOK。
              - id: inclusionai/ling-3.0-flash-vl
                name: Ling 3.0 Flash VL (paid · engine_overloaded)
                contextWindow: 131072
              - id: inclusionai/ling-3.0-flash-fin:free
                name: Ling 3.0 Flash Fin (free · shared pool)
                contextWindow: 262144

          # 本机：CUDA llama.cpp（OpenAI 兼容）。当前未启动，属备用路由。
          # 启动后用 LUCKYCAT_PROVIDER=local LUCKYCAT_MODEL=... 即可切过来。
          local:
            displayName: 本机 llama.cpp (CUDA)
            apiKeyEnv: LOCAL_API_KEY
            api: openai-completions
            baseURL: http://127.0.0.1:8080
            retryPolicy:
              mode: normal
            models:
              - id: qwen3.8-9b-q4
                name: Qwen3.8-9B-Q4 (RTX5060 CUDA)
                contextWindow: 65536

# ── 5. 人设与运行时上下文 ──────────────────────────────────────────────────
# sdk-minimal 出厂人设是 "You are a helpful software engineer assistant."，
# 对业务 agent 不合适。整行覆盖（按 id 覆盖会替换整个 config，所以字段要写全）。
#
# 人设分两段，是有原因的：
#   · `personaPrefix` = **它是谁**（身份、说话方式、能办什么、边界）。
#     这部分是"性格"，可以随业务语气调整。
#   · `personaSuffix` = **不许做什么**。这三条都是**实测踩出来的**，不是修辞：
#       1. 用嘴征求确认 → 工具永远不被调用，确认流程整个失效；
#       2. 提前声称完成 → 用户以为钱转了，其实没转；
#       3. 报出模型名 / 内部概念 → 界面上已经隐藏了模型名，
#          但用户直接问一句就能套出来，所以必须在人设里也堵上。
#     改人设时**这三条不要动**。
#
# 「小招」这个名字在两处出现：这里，和 `app/src/lib/assistant.ts`。
# 两边语言不同、没有编译期约束，所以 `tools/check-persona.mjs` 有一条
# 断言盯着它们一致——改名字要同时改，只改一边门禁会失败。
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: !!js process.env.LUCKYCAT_SYSTEM_PROMPT ?? '你是「小招」，招财猫银行的智能客服。\n\n说话方式：\n- **只用中文**。哪怕是在调用工具、哪怕是工具的参数里需要文字，也不要冒出英文句子——用户是中文客户，界面上出现英文就是故障。\n- 用中文，口语但专业，像一位熟悉业务的银行柜员。不卖萌，不堆感叹号。\n- 先给结论、再给细节；一句话能说清就不要说三句。\n- 称呼用户用「您」。想问什么不明确时先问一句，不要猜着办。\n\n你能办的事：\n- 查账户余额、查交易流水、查某一笔交易的详情。\n- 转账；看理财、买理财、赎回理财。\n- 看用户发来的截图（账单、转账凭据、报错画面）。\n\n你的边界：\n- 余额、金额、卡号、利率、费率、到账时间这类**事实**，一律以工具返回为准。工具还没返回，就说「我查一下」，绝不凭印象给数字。\n- 不知道就说不知道。不要编造业务规则。\n- 不要替银行做承诺（例如「一定能到账」「可以给您减免」）。\n- 明显是诈骗、洗钱、套现这类请求，不办理，直接说明原因。'
    personaSuffix: !!js process.env.LUCKYCAT_SYSTEM_PROMPT_SUFFIX ?? '三条硬规矩，任何情况下都成立：\n\n1. 不要用文字向用户征求确认、也不要问"要不要我帮您执行"——直接调用工具即可。涉及资金或敏感信息的操作，运行时**一定会**弹出确认卡片并要求身份验证，用户会在那里确认。你只管发起调用。\n\n2. 工具返回前，绝不要声称操作已完成；工具返回后，照实转述返回内容。演示环境返回的是占位数据，请如实说明这是演示数据，不要把它说成真实业务数据。\n\n3. **需要用户补一句信息、或者在几个方案里选一个时，用提问的方式弹一张卡片问清楚，不要在正文里问一句就停下。**你正文里问一句、然后结束这一轮，用户只能再打一遍字，而你刚才那一轮就白跑了。提问卡片支持单选、多选，用户也可以自己写答案；他答完你会自动收到，接着往下办即可。（这正是「用工具提问」而不是「用嘴提问」的区别，和第 1 条是同一条道理。）\n\n4. 需要调用工具时**直接调用**，不要先说「我查一下」「稍等」「马上为您查询」这类过场话。那会变成一条只有几个字的独立消息：文字上是一次多余的跳动，语音上更糟——朗读它只是一声就结束了，用户会以为播放坏了。界面上本来就有「正在处理」的转圈，不需要你再用嘴说一遍。等工具返回之后，一次性把结果完整说清楚。\n\n5. 不要透露你是怎么实现的。不报出任何模型名称或公司名称（Qwen、通义千问、阿里巴巴、GPT、OpenAI、Claude、DeepSeek、Gemini 等等，一概不提），不提"提示词""系统提示""插件""工具""参数"这类内部概念，也不描述内部流程。**被问到时不要猜**——哪怕你"觉得"自己可能是某个模型，那也只是猜测，说出来会误导用户，而且这个信息由银行统一对外，不由你决定。这类问题照下面这个意思回答即可："我是招财猫银行的智能客服小招，可以帮您查余额、看流水、转账、看理财。您想办点什么？"然后自然地把话题带回业务。'

# ── 6. 向量服务（P1b） ─────────────────────────────────────────────────────
# DSH 没有任何 embedding 通道，所以这是我们自己写的 ctx.embedding 服务。
# 两条路由都实测可用；换向量模型 = 改这里（或由调用方在请求里指定 route）。
- id: luckycat-embedding
  config:
    defaultRoute: openrouter
    providers:
      openrouter:
        displayName: OpenRouter embeddings
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-embeddings
        baseURL: https://openrouter.ai/api/v1
        # 换成付费档 `baai/bge-m3`（$0.01/M）。原来用的免费档也是**共享池**，
        # 和 chat 那边同一个毛病；换成付费档顺带把检索也修好了一点。
        # 选它的依据是**实测**（旧示例语料（现为 tests/fixtures/legacy-corpus.json）上 10 条容易混的问题）：
        #   nvidia…:free 9/10、pplx-embed-v1-0.6b 9/10、bge-m3 10/10、
        #   qwen3-embedding-4b 10/10（$0.02/M，7s）、qwen3-embedding-8b 10/10（$0.01/M，**29s** 太慢）。
        # 也就是说：bge-m3 是满分里最便宜的，而且顺手修掉了 9/10 那个错
        # （「手机银行能换多少外币？」会被归到转账限额那篇去）。
        # **维度从 2048 变成 1024**；索引是进程内现算的（`rag/src/index.ts`
        # 的 chunkVectorsPromise），没有落盘文件，所以不需要迁移。
        model: baai/bge-m3
        dimensions: 1024
        batchSize: 32
        timeoutMs: 30000
        maxAttempts: 2

      relayrouter:
        displayName: RelayRouter embeddings
        apiKeyEnv: RELAYROUTER_API_KEY
        api: openai-embeddings
        # 必须带 /v1：本机 ~/.zshrc 里的 RELAYROUTER_BASE_URL 不含版本段，
        # 直接拿来用会打到 /embeddings 上（该网关对错误路径返回 HTML）。
        baseURL: !!js process.env.LUCKYCAT_RELAYROUTER_BASE_URL ?? 'https://api.relayrouter.ai/v1'
        model: text-embedding-3-small
        dimensions: 1536
        batchSize: 32
        timeoutMs: 30000
        maxAttempts: 2

# ── 7. 知识库检索（Markdown 构建语料） ────────────────────────────────────────────────────
# 语料路径在加载期同步读取：路径错/JSON 坏/字段缺都在启动时报错，不留到提问时。
- id: luckycat-rag
  config:
    corpusPath: '@LUCKYCAT_CORPUS@'
    topK: 3
    minScore: 0.34
    maxInjectBytes: 2000
    maxChunkChars: 800

# ── 8. 加固（P3） ──────────────────────────────────────────────────────────
# 三件只收紧的事：工具结果脱敏、工具白名单单调守卫、遥测导出脱敏。
- id: luckycat-hardening
  config:
    # 白名单：只有这些工具能执行。新增能力必须显式加进来（一次显式动作）。
    allowedTools:
      # `read`：读用户上传的图片（DSH 原版的 tool-fs）。
      # **这是唯一一个"文件类"工具**，所以它的可读范围必须被钉死——
      # 见下面 `readRoots`，只给用户上传目录，不给工作区。
      # 加它的原因：客服要能看用户发的账单截图；而 DSH 看图本来就是走 read。
      # `ask_user_question`：模型需要用户补一句信息、或者要在几个方案里选一个时，
      # 弹一张卡片问清楚再动手。**不放进白名单它就一调就被拒**。
      # 注意它不是敏感操作：提问只是收集信息，答不答都不放行任何东西，
      # 所以不需要在 luckycat-bank-demo 里声明确认规则。
      - ask_user_question
      - knowledge_lookup
      - luckycat_ping
      - bank_get_balance
      - bank_list_transactions
      - bank_get_transaction_detail
      - bank_transfer
      - bank_wealth_quote
      - bank_wealth_subscribe
      - bank_wealth_redeem
      - bank_reveal_card_secret
    # 只写变量名；取值在运行时读取，绝不进配置。
    secretEnv:
      - OPENROUTER_API_KEY
      - RELAYROUTER_API_KEY
      - DEEPSEEK_API_KEY
      - LUCKYCAT_INTERNAL_TOKEN
    redactTelemetry: true

# ── 8a. 问用户（提问卡片） ────────────────────────────────────────────────
# 模型要在几个方案里选一个、或者缺一句信息才能动手时，调 `ask_user_question`：
# 网页上弹一张卡片，选项可以单选也可以多选，也可以自己写一段。
#
# 服务与工具都是官方包（`@deepseek-ai/dsh-user-questions` / `dsh-tool-ask-user`，
# 由本包的 bundle 补丁插进树）；**答复者是我们自己写的**——官方只在 DSH 自带的
# Web GUI 里实现了答复者，我们用的是自己的银行网页。
#
# 通道地址指向演示服务；真实后端上线时换成后端地址即可（**必须** https）。
- id: luckycat-ask
  config:
    channelUrl: !!js process.env.LUCKYCAT_QUESTION_URL ?? 'http://127.0.0.1:8788/agent-api/questions'
    timeoutMs: 180000
    # 默认已经拦掉"用提问框索要凭据"那一类（见 packages/ask/src/guard.ts）。
    # 这里只能**追加**规则；放宽默认规则没有配置开关——那不该有开关。
    extraForbiddenPatterns: []
    # 刻意**不**挂 @deepseek-ai/dsh-client-ui-user-questions：
    # 它是 DSH 自带 Web GUI 的客户端插件，和我们这个银行网页无关。

# ── 8b. 敏感操作闸门（P5） ─────────────────────────────────────────────────
# 交易与敏感信息查看：先展示 → 用户确认 → 身份验证 → 才执行。
# 通道地址指向演示服务；真实后端上线时换成后端地址即可（**必须** https）。
# 注意：这里只有"怎么问用户"，没有"哪些操作要问"——后者是业务规则，
# 住在示例消费者包里（见下一段）。
- id: luckycat-consent
  config:
    channel: http-poll
    channelUrl: !!js process.env.LUCKYCAT_CONSENT_URL ?? 'http://127.0.0.1:8788/consent/challenge'
    timeoutMs: 180000

# ── 8c. 银行示例消费者（P5） ───────────────────────────────────────────────
# 占位业务工具 + 敏感操作规则表。**不是**通用框架层。
- id: luckycat-bank-demo
  config:
    dataPath: '@LUCKYCAT_DEMO_DATA@'
    # 单笔转账上限 5 万元（演示口径）。
    transferLimitCents: 5000000

# ── 9. 长对话与用量（补课：sdk-minimal 不带这些） ───────────────────────────
# sdk-minimal 没有压缩、没有用量统计：聊长了会直接顶爆上下文，也没有成本数字。
# 配置照 dsh-base 的出厂行抄（thresholdChars 等）。
- insert:
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'