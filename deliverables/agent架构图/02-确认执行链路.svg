<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1330" viewBox="0 0 1920 1330"><defs><marker id="m2865B6" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 Z" fill="#2865B6"/></marker><marker id="m137D79" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 Z" fill="#137D79"/></marker><marker id="m7650A5" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 Z" fill="#7650A5"/></marker><marker id="mB36B16" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 Z" fill="#B36B16"/></marker><marker id="m52677B" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 Z" fill="#52677B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="44" y="153" width="392" height="1009" rx="14" fill="#F6F9FD" stroke="#D9E4EF" stroke-width="1.3"/><rect x="476" y="153" width="408" height="1009" rx="14" fill="#F1F8F8" stroke="#D9E4EF" stroke-width="1.3"/><rect x="924" y="153" width="496" height="1009" rx="14" fill="#F6F9FD" stroke="#D9E4EF" stroke-width="1.3"/><rect x="1460" y="153" width="416" height="1009" rx="14" fill="#F6F9FD" stroke="#D9E4EF" stroke-width="1.3"/><path d="M 414 279 L 498 279" fill="none" stroke="#2865B6" stroke-width="2"  marker-end="url(#m2865B6)"/><path d="M 680 326 L 680 362" fill="none" stroke="#137D79" stroke-width="2"  marker-end="url(#m137D79)"/><path d="M 680 454 L 680 492" fill="none" stroke="#137D79" stroke-width="2"  marker-end="url(#m137D79)"/><path d="M 862 550 L 946 550" fill="none" stroke="#2865B6" stroke-width="2"  marker-end="url(#m2865B6)"/><path d="M 1398 550 L 1482 550" fill="none" stroke="#2865B6" stroke-width="2"  marker-end="url(#m2865B6)"/><polygon points="1398,550 1407.0,554.0 1407.0,546.0" fill="#2865B6"/><path d="M 1172 607 L 1172 633 L 240 633 L 240 656" fill="none" stroke="#B36B16" stroke-width="2"  marker-end="url(#mB36B16)"/><path d="M 414 756 L 454 756 L 454 826 L 909 826 L 909 800 L 946 800" fill="none" stroke="#B36B16" stroke-width="2"  marker-end="url(#mB36B16)"/><path d="M 1172 862 L 1172 893 L 680 893 L 680 932" fill="none" stroke="#2865B6" stroke-width="2"  marker-end="url(#m2865B6)"/><path d="M 862 990 L 946 990" fill="none" stroke="#2865B6" stroke-width="2"  marker-end="url(#m2865B6)"/><path d="M 1398 990 L 1482 990" fill="none" stroke="#2865B6" stroke-width="2"  marker-end="url(#m2865B6)"/><path d="M 1668 1047 L 1668 1115 L 862 1115" fill="none" stroke="#2865B6" stroke-width="2"  marker-end="url(#m2865B6)"/><path d="M 498 1115 L 414 1115" fill="none" stroke="#2865B6" stroke-width="2"  marker-end="url(#m2865B6)"/><text font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#18334D" text-anchor="start"><tspan x="44" y="62.0">工具调用 · 用户确认 · 银行执行</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="46" y="105.0">以需要确认的客户 / 员工银行工具为例；工具参数、可信确认字段、最终执行结果分别处理。</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="1770" y="57.0">02 / 02</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="64" y="190.0">用户与客户端</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="496" y="190.0">Harness 与插件</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="944" y="190.0">可信 Bridge</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="1480" y="190.0">银行 HTTP 服务</tspan></text><rect x="66" y="231" width="348" height="95" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="84" y="262.0">① 发起需求</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="84" y="295.0">自然语言 / 功能入口 / 图片</tspan></text><rect x="498" y="231" width="364" height="95" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="516" y="262.0">② 选择技能与工具</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="516" y="295.0">LLM 理解需求；知识检索 / 补问</tspan></text><rect x="498" y="362" width="364" height="92" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="516" y="393.0">③ 形成结构化工具调用</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="516" y="426.0">工具名、参数与本次调用标识</tspan></text><rect x="498" y="492" width="364" height="115" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="516" y="523.0">④ 执行前进入审批</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="516" y="556.0">tools/pre-execute → consent</tspan><tspan x="516" y="577.3">approval/request 等待可信答复</tspan></text><rect x="946" y="492" width="452" height="115" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="964" y="523.0">⑤ prepare：构造可信确认内容</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="964" y="556.0">重新验证身份、归属、工具及参数</tspan><tspan x="964" y="577.3">读取当前业务数据，绑定本次调用</tspan></text><rect x="1482" y="492" width="372" height="115" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="1500" y="523.0">读取权威状态</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="1500" y="555.0">客户 / 收款信息 / 产品 / 工单等</tspan><tspan x="1500" y="574.88">生成可核对的真实业务字段</tspan></text><rect x="66" y="656" width="348" height="143" rx="14" fill="#FFF9EF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#B36B16" text-anchor="start"><tspan x="84" y="687.0">⑥ 展示确认卡并由本人操作</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="84" y="720.0">核对真实字段、金额和后果</tspan><tspan x="84" y="741.3">按需支付密码 / 风险语句</tspan><tspan x="84" y="762.6">员工代办按需完成客户核验</tspan></text><rect x="946" y="739" width="452" height="123" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="964" y="770.0">⑦ approve：验证并登记授权</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="964" y="803.0">按业务要求核验；仅 Bridge 持有凭据</tspan><tspan x="964" y="824.3">授权绑定身份、会话、轮次、调用与参数</tspan><tspan x="964" y="845.6">取消 / 超时 / 停止使待执行授权失效</tspan></text><rect x="498" y="932" width="364" height="115" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="516" y="963.0">⑧ 白名单守卫 → 工具执行</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="516" y="996.0">批准后经 hardening 守卫</tspan><tspan x="516" y="1017.3">仅发送工具名、参数与调用标识</tspan></text><rect x="946" y="932" width="452" height="115" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="964" y="963.0">⑨ execute：提交前再次校验</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="964" y="996.0">核对授权、参数指纹、有效期与状态</tspan><tspan x="964" y="1017.3">先消费一次授权，再调用银行服务</tspan></text><rect x="1482" y="932" width="372" height="115" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="1500" y="963.0">⑩ 银行业务执行</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="1500" y="996.0">后端再次鉴权与业务校验</tspan><tspan x="1500" y="1017.3">幂等 / 事务 / 业务回执</tspan></text><rect x="498" y="1084" width="364" height="62" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="516" y="1114.0">⑪ 根据真实结果生成回复</tspan></text><rect x="66" y="1084" width="348" height="62" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="84" y="1114.0">⑫ SSE 展示回复与实际状态</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="904.0" y="521.0">内部通道</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#B36B16" text-anchor="middle"><tspan x="848.0" y="620.0">真实确认字段经 SSE 下发</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#B36B16" text-anchor="middle"><tspan x="709.0" y="812.0">确认与验证信息直接发往 Bridge</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="916.0" y="878.0">仅返回批准 / 拒绝；凭据留在 Bridge</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="1196.5" y="1100.0">银行回执经 Bridge 投影 / 脱敏</tspan></text><rect x="44" y="1191" width="890" height="88" rx="14" fill="#EFF6FF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="62" y="1221.0">IM 查询特例</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="62" y="1254.0">有效绑定内，白名单只读 GET 可由可信 Bridge 发放本轮一次查询授权；写入及敏感信息仍走确认。</tspan></text><rect x="956" y="1191" width="920" height="88" rx="14" fill="#F5F0FA" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#7650A5" text-anchor="start"><tspan x="974" y="1221.0">运维工具分支</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="974" y="1254.0">ops-native → ops-gate / Clef → 自动通过、人工确认或拒绝 → 一次授权 → 原生沙箱工具；审计留档。</tspan></text></svg>