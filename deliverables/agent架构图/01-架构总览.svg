write + Clef 风险决策</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="64" y="366.0">接入层</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="64" y="391.0">按登录角色选择 Agent 通道</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="398" y="366.0">可信桥接层</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="398" y="391.0">demo-server.mjs；staff / ops 复用入口</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="830" y="366.0">DSH Agent 运行时</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="830" y="391.0">每实例独立子进程 · profile 隔离</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="1478" y="366.0">外部服务与执行目标</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="1478" y="391.0">通过模型适配器、业务适配器或沙箱调用</tspan></text><rect x="64" y="417" width="214" height="120" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="82" y="448.0">客户网页 / Android</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="82" y="480.0">文本、图片、确认卡</tspan><tspan x="82" y="499.88">REST + SSE</tspan></text><rect x="64" y="569" width="214" height="111" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="82" y="600.0">工作人员网页</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="82" y="632.0">客服 / 主管 / 运维</tspan><tspan x="82" y="651.88">按角色路由</tspan></text><rect x="64" y="718" width="214" height="142" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="82" y="749.0">微信 / 企微〔可选〕</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="82" y="781.0">绑定既有银行身份</tspan><tspan x="82" y="800.88">复用会话与确认入口</tspan><tspan x="82" y="820.76">提醒仅投递文字</tspan></text><rect x="398" y="417" width="312" height="122" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="416" y="448.0">身份、权限与会话归属</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="416" y="481.0">校验银行 / 员工 Bearer</tspan><tspan x="416" y="502.3">会话 owner 与角色校验</tspan><tspan x="416" y="523.6">停止、恢复与请求限流</tspan></text><rect x="398" y="578" width="312" height="127" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="416" y="609.0">消息与交互通道</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="416" y="641.0">SSE / 事件重放与轮询</tspan><tspan x="416" y="660.88">补问卡、确认卡、图片附件</tspan><tspan x="416" y="680.76">ASR / TTS 服务端代理〔可选〕</tspan></text><rect x="398" y="752" width="312" height="178" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="416" y="783.0">可信业务适配与授权</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="416" y="815.0">bank-agent / staff-agent</tspan><tspan x="416" y="834.88">准备真实字段、验证、一次授权</tspan><tspan x="416" y="854.76">携带令牌调用银行 HTTP</tspan><tspan x="416" y="874.64">ops-gate：风险判定与运维授权</tspan></text><rect x="832" y="417" width="524" height="122" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="850" y="448.0">DeepSeek Harness 0.2.1-rc.2</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="850" y="481.0">SDK 驱动 · Cordis 插件装配</tspan><tspan x="850" y="502.3">LLM 回合 / 工具调用 / 上下文压缩与检查点</tspan><tspan x="850" y="523.6">llm-pi-ai：OpenRouter 或本地兼容模型</tspan></text><rect x="832" y="581" width="250" height="157" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="850" y="611.0">技能与知识〔客户〕</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="850" y="644.0">skills 按需加载业务流程</tspan><tspan x="850" y="663.88">RAG：knowledge_lookup</tspan><tspan x="850" y="683.76">向量 + 关键词；异常降级</tspan><tspan x="850" y="703.64">语料来自 knowledge/*.md</tspan></text><rect x="1102" y="581" width="254" height="157" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="1120" y="611.0">按角色装配工具</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="1120" y="644.0">客户：bank_*</tspan><tspan x="1120" y="663.88">客服 / 主管：staff_*</tspan><tspan x="1120" y="683.76">运维：文件 / 终端 / 作业</tspan><tspan x="1120" y="703.64">工具定义与业务适配分离</tspan></text><rect x="832" y="778" width="524" height="152" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="850" y="809.0">执行约束与交互插件</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="850" y="842.0">hardening：工具白名单、结果及遥测脱敏</tspan><tspan x="850" y="863.3">consent：tools/pre-execute → 原生 approval</tspan><tspan x="850" y="884.6">ask：收集补充信息，并拦截凭据输入</tspan><tspan x="850" y="905.9">ops-native：专属风险检查 + 原生沙箱</tspan></text><rect x="1478" y="417" width="378" height="122" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="1496" y="448.0">模型服务</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="1496" y="481.0">OpenRouter 主 / 备用模型路由</tspan><tspan x="1496" y="502.3">本地 OpenAI 兼容服务〔可选〕</tspan><tspan x="1496" y="523.6">Embedding 为 RAG 提供向量</tspan></text><rect x="1478" y="606" width="378" height="128" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="1496" y="637.0">银行 HTTP 服务  ·  server/</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="1496" y="669.0">/api/* 客户业务  ·  /staff-api/* 员工业务</tspan><tspan x="1496" y="688.88">最终鉴权、业务校验、幂等与事务</tspan><tspan x="1496" y="708.76">业务结果以银行实际回执为准</tspan></text><rect x="1478" y="802" width="378" height="128" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#7650A5" text-anchor="start"><tspan x="1496" y="833.0">运维执行环境〔仅 ops〕</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="1496" y="865.0">Clef 决策 → 自动 / 人工 / 拒绝</tspan><tspan x="1496" y="884.88">原生文件、PowerShell / bash、作业</tspan><tspan x="1496" y="904.76">workspace-write 沙箱 + 审计日志</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="336.0" y="443.0">Bearer</tspan><tspan x="336.0" y="460.04">REST / SSE</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="771.0" y="438.0">SDK</tspan><tspan x="771.0" y="455.04">stdio RPC</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="1417.0" y="439.0">模型 / 向量</tspan><tspan x="1417.0" y="456.04">API</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="770.0" y="804.0">本机 HTTP</tspan><tspan x="770.0" y="821.04">随机口令</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="1190.0" y="953.0">携带真实身份 · 银行业务 HTTP</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#7650A5" text-anchor="middle"><tspan x="1417.5" y="760.0">ops 专属</tspan><tspan x="1417.5" y="777.04">风险闸门</tspan></text><rect x="378" y="1064" width="452" height="137" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="396" y="1095.0">AI 会话 PostgreSQL  ·  ai_sessions</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="396" y="1127.0">Bridge 保存会话归属与 AES-256-GCM 加密事件</tspan><tspan x="396" y="1146.88">namespace: customer / staff / ops</tspan><tspan x="396" y="1166.76">每个 namespace 单实例持锁；AI 角色无资金表权限</tspan></text><rect x="858" y="1064" width="520" height="137" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#137D79" text-anchor="start"><tspan x="876" y="1095.0">本地持久化目录</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="876" y="1127.0">Harness sessions：完整模型上下文、检查点</tspan><tspan x="876" y="1146.88">上传附件、IM 绑定与任务资料〔按启用能力隔离〕</tspan><tspan x="876" y="1166.76">运维 native-audit.jsonl；恢复需匹配目录与密钥</tspan></text><rect x="1458" y="1064" width="418" height="137" rx="14" fill="#FFFFFF" stroke="#CBD9E6" stroke-width="1.3"/><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#2865B6" text-anchor="start"><tspan x="1476" y="1095.0">银行 PostgreSQL</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="1476" y="1127.0">资金、账户、交易、工单与审批</tspan><tspan x="1476" y="1146.88">仅由银行服务提交业务事务</tspan><tspan x="1476" y="1166.76">银行数据密钥与 AI 会话密钥分别管理</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#2865B6" text-anchor="middle"><tspan x="443.0" y="1029.0">归属 / 加密回放</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#137D79" text-anchor="middle"><tspan x="1215.0" y="1022.0">运行上下文 / 附件</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#18334D" text-anchor="start"><tspan x="46" y="1076.0">连线说明</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="46" y="1114.0">实线：主要请求 / 数据链路</tspan><tspan x="46" y="1133.88">虚线：可选或角色专属链路</tspan><tspan x="46" y="1153.76">双向箭头：请求与返回</tspan></text><text font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#52677B" text-anchor="start"><tspan x="46" y="1245.0">边界：银行 Bearer 与支付密码留在可信桥接层；客户和员工工具通过桥接层访问银行。图示为代码架构，通道启用情况以部署配置为准。</tspan></text></svg>