:root{--page:#F5F7FF;--ink:#061B31;--ink2:#4E6078;--muted:#64748D;--line:#E5EDF5;--bad:#D92159;--warn:#B45309;--good:#0F766E;--accent:#533AFD}
*{box-sizing:border-box}
body{margin:0;padding:40px 32px 72px;background:var(--page);color:var(--ink);

.grid{max-width:1320px;margin:0 auto;display:grid;gap:22px;

figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  transition:box-shadow .15s,border-color .15s}
figure:hover{box-shadow:0 10px 28px rgba(6,27,49,.10);border-color:#d5e0ec}
img{display:block;width:100%;height:auto;background:#eef2f8}
figcaption{padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--ink);

.no{font:600 11px/1 ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);

.bad figcaption{border-top:3px solid var(--bad)}
.warn figcaption{border-top:3px solid var(--warn)}
.good figcaption{border-top:3px solid var(--good)}
footer{max-width:1320px;margin:36px auto 0;color:var(--muted);font-size:13px}
