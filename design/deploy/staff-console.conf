# Compatibility for existing staff bookmarks and API clients.
location = /staff { return 302 /bank/staff/; }
location /staff/ { rewrite ^/staff/(.*)$ /bank/staff/$1 redirect; }
# Terminal traffic is served through the HTTPS guga site and an encrypted SSH tunnel.
# Do not expose interactive Shell input through this legacy plain-HTTP entry.
location /staff-api/ops/terminal/ { return 404; }
location /staff-api/ {
    proxy_pass http://127.0.0.1:8080/staff-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
}
location /staff-agent-api/ {
    proxy_pass http://127.0.0.1:8789/agent-api/;
    include /etc/nginx/snippets/maneki-agent-proxy.conf;
}
location /staff-ops-agent-api/ {
    proxy_pass http://127.0.0.1:8790/agent-api/;
    include /etc/nginx/snippets/maneki-agent-proxy.conf;
}
