# guga: independent frontend, existing bank/Agent services stay on the original server.
server {
    listen 80;
    listen [::]:80;
    server_name bank.waveflow.men;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://bank.waveflow.men$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bank.waveflow.men;
    ssl_certificate /etc/letsencrypt/live/bank.waveflow.men/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bank.waveflow.men/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/bank.waveflow.men-app.conf;
}
