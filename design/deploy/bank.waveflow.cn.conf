# 招财猫银行——静态前端 + 同源 SQLite 银行业务 API
server {
    listen 80;
    server_name bank.waveflow.cn;
    root /var/www/bank.waveflow.cn;
    index index.html;

    # 银行业务请求必须由后端处理，不能回落为 index.html。
    # 在本机启动 Node.js 24 的 server/index.mjs，默认监听 8080。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    # 独立智能助手通道，保持现有桥接端口与 SSE 流式响应。
    location ^~ /agent-api/ {
        proxy_pass http://127.0.0.1:8898;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 单页应用：/cards、/transactions/:id 这些路径在服务端没有对应文件。
    # 不做回落的话，用户刷新任意子页面都会 404（SPA 最常见的上线事故）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产出的文件名带内容指纹，内容变了文件名就变，可以放心长缓存。
    # 这里**不要**再写 expires —— 它会自己发一条 Cache-Control，
    # 和 add_header 撞在一起就成了两条头，缓存行为反而变得不确定。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 行标 / 品牌标 / 字体：文件名不带指纹（banks/cn-102.svg），
    # 所以只给一天，免得换素材后旧的被缓存太久
    location ~* \.(svg|png|ico|woff2?)$ {
        expires 1d;
    }

    # 外壳不能缓存：否则发了新版，用户还在跑旧 index.html 去请求已经不存在的 assets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
