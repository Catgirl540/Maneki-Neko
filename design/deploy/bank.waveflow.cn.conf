# 招财猫银行（虚拟银行演示）—— 纯前端静态站点，数据全在浏览器 localStorage 里
server {
    listen 80;
    server_name bank.waveflow.cn;
    root /var/www/bank.waveflow.cn;
    index index.html;

    # 单页应用：/cards、/transactions/:id 这些路径在服务端没有对应文件。
    # 不做回落的话，用户刷新任意子页面都会 404（SPA 最常见的上线事故）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产出的文件名带内容指纹，内容变了文件名就变，可以放心长缓存。
    # 这里**不要**再写 expires —— 它会自己发一条 Cache-Control，
    # 和 add_header 撞在一起就成了两条头，缓存行为反而变得不确定。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 行标 / 品牌标 / 字体：文件名不带指纹（banks/cn-102.svg），
    # 所以只给一天，免得换素材后旧的被缓存太久
    location ~* \.(svg|png|ico|woff2?)$ {
        expires 1d;
    }

    # 外壳不能缓存：否则发了新版，用户还在跑旧 index.html 去请求已经不存在的 assets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
