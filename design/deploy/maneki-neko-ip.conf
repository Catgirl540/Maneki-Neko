# Include from the existing 120.48.123.112 server block; keep its root application.
location = /bank { return 301 /bank/; }
location = /bank/downloads/android.json {
    root /var/www/maneki-neko/current-bank;
    default_type application/json;
    add_header Cache-Control 'no-store';
    add_header X-Content-Type-Options 'nosniff';
    try_files $uri =404;
}
location ^~ /bank/downloads/ {
    root /var/www/maneki-neko/current-bank;
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header Content-Disposition 'attachment';
    add_header X-Content-Type-Options 'nosniff';
    try_files $uri =404;
}
location /bank/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Terminal traffic is served through the HTTPS guga site and an encrypted SSH tunnel.
# Do not expose interactive Shell input through this legacy plain-HTTP entry.
location /bank/staff-api/ops/terminal/ { return 404; }
location /bank/staff-api/ {
    proxy_pass http://127.0.0.1:8080/staff-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
}
location /bank/agent-api/ {
    proxy_pass http://127.0.0.1:8898/agent-api/;
    include /etc/nginx/snippets/maneki-agent-proxy.conf;
}
location /bank/staff-agent-api/ {
    proxy_pass http://127.0.0.1:8789/agent-api/;
    include /etc/nginx/snippets/maneki-agent-proxy.conf;
}
location /bank/staff-ops-agent-api/ {
    proxy_pass http://127.0.0.1:8790/agent-api/;
    include /etc/nginx/snippets/maneki-agent-proxy.conf;
}
location = /bank/staff { return 302 /bank/staff/; }
location ^~ /bank/staff/assets/ {
    root /var/www/maneki-neko/current-bank;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
}
location /bank/staff/ {
    root /var/www/maneki-neko/current-bank;
    add_header Cache-Control 'no-store';
    try_files $uri $uri/ /bank/staff/index.html;
}
location ^~ /bank/assets/ {
    root /var/www/maneki-neko/current-bank;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
}
location = /bank/index.html {
    root /var/www/maneki-neko/current-bank;
    add_header Cache-Control 'no-store';
}
location /bank/ {
    root /var/www/maneki-neko/current-bank;
    try_files $uri $uri/ /bank/index.html;
}
