root /var/www/bank.waveflow.men/current;
index index.html;
client_max_body_size 20m;

proxy_http_version 1.1;
proxy_set_header Host 120.48.123.112;
proxy_set_header Authorization $http_authorization;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_intercept_errors off;

location ^~ /api/ {
    proxy_pass http://120.48.123.112/bank/api/;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /staff-api/ops/terminal/ {
    # Encrypted SSH forward on guga -> original bank server 127.0.0.1:8080.
    proxy_pass http://127.0.0.1:18080/staff-api/ops/terminal/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
}
location ^~ /staff-api/ {
    proxy_pass http://120.48.123.112/bank/staff-api/;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /agent-api/ {
    proxy_pass http://120.48.123.112/bank/agent-api/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location ^~ /staff-agent-api/ {
    proxy_pass http://120.48.123.112/bank/staff-agent-api/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location ^~ /staff-ops-agent-api/ {
    proxy_pass http://120.48.123.112/bank/staff-ops-agent-api/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Reuse the published Flutter APK; this release does not rebuild Android.
location ^~ /downloads/ {
    proxy_pass http://120.48.123.112/bank/downloads/;
    proxy_read_timeout 120s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "no-cache" always;
}

location = /staff { return 302 /staff/; }
location /staff/ {
    try_files $uri $uri/ /staff/index.html;
    add_header Cache-Control "no-cache" always;
}
location ~* ^/(?:staff/)?assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /index.html { add_header Cache-Control "no-cache" always; }
location = /staff/index.html { add_header Cache-Control "no-cache" always; }
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}

gzip on;
gzip_types text/css application/javascript image/svg+xml application/json;
gzip_min_length 1024;
