root /var/www/bank.waveflow.men/current;
index index.html;
client_max_body_size 20m;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Authorization $http_authorization;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_intercept_errors off;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8081/api/;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /staff-api/ops/terminal/ {
    proxy_pass http://127.0.0.1:8080/staff-api/ops/terminal/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
}
location ^~ /staff-api/ {
    proxy_pass http://127.0.0.1:8080/staff-api/;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /agent-api/ {
    proxy_pass http://127.0.0.1:8891/agent-api/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location ^~ /staff-agent-api/ {
    proxy_pass http://127.0.0.1:8789/agent-api/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location ^~ /staff-ops-agent-api/ {
    proxy_pass http://127.0.0.1:8790/agent-api/;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 已迁移并校验的 Flutter 发布包，全部由本机提供。
location = /downloads/android.json {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /downloads/ {
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /staff { return 302 /staff/; }
location /staff/ {
    try_files $uri $uri/ /staff/index.html;
    add_header Cache-Control "no-cache" always;
}
location ~* ^/(?:staff/)?assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /index.html { add_header Cache-Control "no-cache" always; }
location = /staff/index.html { add_header Cache-Control "no-cache" always; }
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}

gzip on;
gzip_types text/css application/javascript image/svg+xml application/json;
gzip_min_length 1024;
