server {
    listen 80;
    listen [::]:80;
    server_name bank.waveflow.men;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bank.waveflow.men;
    ssl_certificate /etc/letsencrypt/live/bank.waveflow.men/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bank.waveflow.men/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/maneki-single-host.conf;
}
