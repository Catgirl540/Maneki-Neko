# Compatibility alias for old staff pages; all staff routes use the unified bank.
# Authentication and csr/supervisor/ops permissions remain enforced by the bank.
location ^~ /staff-demo-api/ops/terminal/ {
    proxy_pass http://127.0.0.1:8081/staff-api/ops/terminal/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
}
location ^~ /staff-demo-api/ {
    proxy_pass http://127.0.0.1:8081/staff-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
