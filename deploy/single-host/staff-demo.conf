# Staff business API for the same isolated sandbox used by the public customer site.
# Original /staff-api/ and all production/operations routes remain unchanged.
location ^~ /staff-demo-api/ops/ {
    return 404;
}
location ^~ /staff-demo-api/ {
    proxy_pass http://127.0.0.1:8081/staff-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
